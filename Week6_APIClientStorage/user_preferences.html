<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Storage - User Preferences</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode { background-color: black; color: white; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        select, button { padding: 8px; margin-top: 4px; }
        button { margin-top: 16px; cursor: pointer; }
        #message { font-weight: bold; color: #27ae60; }
        body.dark-mode #message { color: #2ecc71; }
    </style>
</head>
<body>
    <h2>Choose Your Preferences</h2>

    <label for="theme">Theme:</label>
    <select id="theme">
        <option value="light">Light Mode</option>
        <option value="dark">Dark Mode</option>
    </select>

    <label for="language">Language:</label>
    <select id="language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
    </select>

    <button onclick="savePreferences()">Save Preferences</button>
    <p id="message"></p>

    <script>
        function savePreferences() {
            let theme = document.getElementById("theme").value;
            let language = document.getElementById("language").value;
            localStorage.setItem("theme", theme);
            localStorage.setItem("language", language);
            applyPreferences();
            document.getElementById("message").innerText = "Preferences Saved!";
        }

        function applyPreferences() {
            let savedTheme = localStorage.getItem("theme");
            let savedLanguage = localStorage.getItem("language");

            if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
            } else {
                document.body.classList.remove("dark-mode");
            }

            document.getElementById("theme").value = savedTheme || "light";
            document.getElementById("language").value = savedLanguage || "en";
        }

        applyPreferences();
    </script>
</body>
</html>
