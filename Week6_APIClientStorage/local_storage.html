<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Storage Example</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        input, button { padding: 8px; margin: 5px 0; }
        button { cursor: pointer; }
        #display { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <h2>Save User Preferences</h2>
    <label for="username">Enter Name:</label><br>
    <input type="text" id="username">
    <button onclick="saveData()">Save</button>
    <button onclick="loadData()">Load</button>
    <p id="display"></p>

    <script>
        function saveData() {
            let name = document.getElementById("username").value;
            localStorage.setItem("userName", name);
            alert("Data Saved!");
        }
        function loadData() {
            let name = localStorage.getItem("userName");
            document.getElementById("display").innerText = name ? "Welcome, " + name : "No data saved!";
        }
    </script>
</body>
</html>
